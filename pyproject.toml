[project]
name = "pubmed-semantic-search"
version = "1.0.0"
description = "Hybrid (dense + BM25) semantic search over PubMed abstracts, with a FastAPI backend."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bare `pytest` does not put the CWD on sys.path the way `python -m pytest`
# does, so `import src.app...` fails in CI without this.
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: tests that load the real FAISS index or a transformer model",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"src/app/db/bootstrap.py" = ["F403", "F401"]  # star-import registers ORM mappers
